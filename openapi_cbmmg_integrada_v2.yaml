openapi: 3.1.0
info:
  title: CBMMG Base Integrada - Normas, Textos e Templates
  version: 2.0.0
  description: >-
    API estática para Custom GPT consultar a base atualizada de normas técnicas do CBMMG,
    manifesto de PDFs oficiais, textos extraídos e catálogo de templates profissionais.
servers:
  - url: https://wellingtonvalente.github.io
paths:
  /normas-bombeiros/normas_com_texto.json:
    get:
      summary: Compatibilidade com o endpoint antigo das ITs com texto extraído
      operationId: listarNormasComTextoCompat
      responses:
        '200':
          description: Base textual das ITs do CBMMG extraída dos PDFs oficiais sincronizados, publicada também na raiz do GitHub Pages por compatibilidade.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  normas:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Documento'
                        - type: object
                          properties:
                            texto:
                              type: string
  /normas-bombeiros/normas_manifest.json:
    get:
      summary: Compatibilidade com o manifesto de normas na raiz do GitHub Pages
      operationId: listarManifestoNormasCompat
      responses:
        '200':
          description: Manifesto auditável publicado também na raiz do GitHub Pages por compatibilidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestoResponse'
  /normas-bombeiros/data/normas_manifest.json:
    get:
      summary: Lista todos os documentos oficiais sincronizados da página do CBMMG
      operationId: listarManifestoNormasCBMMG
      responses:
        '200':
          description: Manifesto auditável com título, categoria, URL oficial, arquivo espelhado, SHA-256 e data de coleta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestoResponse'
  /normas-bombeiros/data/instrucoes_tecnicas_manifest.json:
    get:
      summary: Lista somente as Instruções Técnicas atuais detectadas na página do CBMMG
      operationId: listarInstrucoesTecnicasCBMMG
      responses:
        '200':
          description: Manifesto das ITs com número, edição, situação, portaria de alteração e URLs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  instrucoes_tecnicas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Documento'
  /normas-bombeiros/data/normas_com_texto.json:
    get:
      summary: Lista as Instruções Técnicas com texto extraído dos PDFs oficiais
      operationId: listarNormasComTexto
      responses:
        '200':
          description: Base textual das ITs do CBMMG extraída dos PDFs oficiais sincronizados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  normas:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Documento'
                        - type: object
                          properties:
                            texto:
                              type: string

  /normas-bombeiros/data/enderecos_cbmmg.json:
    get:
      summary: Lista unidades/endereço CBMMG com SSCIP cadastradas na base local
      operationId: listarEnderecosCBMMG
      responses:
        '200':
          description: Base local de endereços de unidades CBMMG e municípios atendidos.
          content:
            application/json:
              schema:
                type: object
  /normas-bombeiros/data/links_nao_pdf.json:
    get:
      summary: Lista links detectados que não retornaram PDF ou foram ignorados
      operationId: listarLinksNaoPdf
      responses:
        '200':
          description: Auditoria de links não baixados.
          content:
            application/json:
              schema:
                type: object
  /normas-bombeiros/templates/formularios/modelos_laudos.json:
    get:
      summary: Lista modelos e templates disponíveis para uso profissional
      operationId: listarTemplatesProfissionais
      responses:
        '200':
          description: Catálogo de modelos documentais, laudos, FATs, formulários e referências de download.
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    Metadata:
      type: object
      properties:
        fonte_oficial:
          type: string
        data_coleta:
          type: string
        total_pdfs:
          type: integer
        total_links_nao_pdf_ou_ignorados:
          type: integer
        total_erros:
          type: integer
        observacao:
          type: string
    Documento:
      type: object
      properties:
        titulo:
          type: string
        url:
          type: string
        categoria:
          type: string
        subcategoria:
          type: string
          nullable: true
        numero_it:
          type: string
          nullable: true
        edicao:
          type: string
          nullable: true
        situacao:
          type: string
          nullable: true
        alteracao:
          type: string
          nullable: true
        arquivo:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        tamanho_bytes:
          type: integer
          nullable: true
        paginas:
          type: integer
          nullable: true
        texto_path:
          type: string
          nullable: true
        origem:
          type: string
    ManifestoResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/Documento'
