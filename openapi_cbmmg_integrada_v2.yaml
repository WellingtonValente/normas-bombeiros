openapi: 3.1.0
info:
  title: CBMMG Base Integrada - Normas, Textos e Templates
  version: 2.3.0
  description: API estática publicada no GitHub Pages para consulta pelo Custom GPT do Guia de Prevenção a Incêndios MG.

servers:
  - url: https://wellingtonvalente.github.io/normas-bombeiros

paths:
  /templates/formularios/modelos_laudos.json:
    get:
      summary: Lista modelos e templates disponíveis para uso profissional
      operationId: listarTemplatesProfissionais
      responses:
        '200':
          description: Catálogo de modelos documentais, laudos, FATs, formulários e referências de download.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatesProfissionaisResponse'

  /data/normas_manifest.json:
    get:
      summary: Lista todos os documentos oficiais sincronizados da página do CBMMG
      operationId: listarManifestoNormasCBMMG
      responses:
        '200':
          description: Manifesto auditável com título, categoria, URL oficial, arquivo espelhado, SHA-256 e data de coleta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestoNormasResponse'

  /data/instrucoes_tecnicas_manifest.json:
    get:
      summary: Lista somente as Instruções Técnicas detectadas
      operationId: listarInstrucoesTecnicasCBMMG
      responses:
        '200':
          description: Manifesto das Instruções Técnicas detectadas na base sincronizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrucoesTecnicasResponse'

  /data/enderecos_cbmmg.json:
    get:
      summary: Lista unidades e endereços CBMMG cadastrados na base local
      operationId: listarEnderecosCBMMG
      responses:
        '200':
          description: Base local de endereços de unidades CBMMG e municípios atendidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecosCBMMGResponse'

  /data/links_nao_pdf.json:
    get:
      summary: Lista links detectados que não retornaram PDF ou foram ignorados
      operationId: listarLinksNaoPdf
      responses:
        '200':
          description: Auditoria de links não baixados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinksNaoPdfResponse'

  /data/erros_download.json:
    get:
      summary: Lista erros de download detectados na sincronização
      operationId: listarErrosDownload
      responses:
        '200':
          description: Auditoria de links com falha de download.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosDownloadResponse'

  /data/normas_com_texto.json:
    get:
      summary: Lista normas com texto extraído dos PDFs oficiais
      operationId: listarNormasComTexto
      responses:
        '200':
          description: Base textual potencialmente grande; use após consultar o manifesto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormasComTextoResponse'

  /normas_com_texto.json:
    get:
      summary: Compatibilidade com endpoint antigo de normas com texto extraído
      operationId: listarNormasComTextoCompat
      responses:
        '200':
          description: Base textual compatível com o GPT antigo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormasComTextoResponse'

components:
  schemas:
    Metadata:
      type: object
      additionalProperties: true
      properties:
        fonte_oficial:
          type: string
        fonte_url:
          type: string
        data_coleta:
          type: string
        generated_at:
          type: string
        total:
          type: integer
        total_pdfs:
          type: integer
        total_links_nao_pdf_ou_ignorados:
          type: integer
        total_erros:
          type: integer
        links_detectados:
          type: integer
        observacao:
          type: string

    DocumentoBase:
      type: object
      additionalProperties: true
      properties:
        titulo:
          type: string
        title:
          type: string
        url:
          type: string
        categoria:
          type: string
        subcategoria:
          type: string
        numero_it:
          type: string
        edicao:
          type: string
        situacao:
          type: string
        alteracao:
          type: string
        arquivo:
          type: string
        sha256:
          type: string
        tamanho_bytes:
          type: integer
        paginas:
          type: integer
        texto_path:
          type: string

    DocumentoComTexto:
      allOf:
        - $ref: '#/components/schemas/DocumentoBase'
        - type: object
          additionalProperties: true
          properties:
            texto:
              type: string
            texto_extraido:
              type: string

    TemplateProfissional:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        title:
          type: string
        titulo:
          type: string
        url:
          type: string
        format:
          type: string
        formato:
          type: string
        jurisdiction:
          type: string
        jurisdicao:
          type: string
        categoria:
          type: string
        perfil:
          type: string
        uso:
          type: string
        documentos_necessarios:
          type: array
          items:
            type: string

    TemplatesProfissionaisResponse:
      type: object
      additionalProperties: true
      properties:
        version:
          type: string
        category:
          type: string
        description:
          type: string
        base_url:
          type: string
        fallback_text:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateProfissional'

    ManifestoNormasResponse:
      type: object
      additionalProperties: true
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        meta:
          $ref: '#/components/schemas/Metadata'
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoBase'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoBase'
        pdfs:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoBase'

    InstrucoesTecnicasResponse:
      type: object
      additionalProperties: true
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        meta:
          $ref: '#/components/schemas/Metadata'
        instrucoes_tecnicas:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoBase'
        its:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoBase'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoBase'

    NormasComTextoResponse:
      type: object
      additionalProperties: true
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        meta:
          $ref: '#/components/schemas/Metadata'
        normas:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoComTexto'
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoComTexto'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoComTexto'

    UnidadeCBMMG:
      type: object
      additionalProperties: true
      properties:
        unidade:
          type: string
        cidade_base:
          type: string
        endereco:
          type: string
        cep:
          type: string
        telefone:
          type: string
        email:
          type: string
        municipios_atendidos:
          type: array
          items:
            type: string

    EnderecosCBMMGResponse:
      type: object
      additionalProperties: true
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        meta:
          $ref: '#/components/schemas/Metadata'
        unidades:
          type: array
          items:
            $ref: '#/components/schemas/UnidadeCBMMG'
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnidadeCBMMG'

    LinkNaoPdf:
      type: object
      additionalProperties: true
      properties:
        titulo:
          type: string
        url:
          type: string
        motivo:
          type: string
        content_type:
          type: string
        status_code:
          type: integer

    LinksNaoPdfResponse:
      type: object
      additionalProperties: true
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LinkNaoPdf'
        links_nao_pdf:
          type: array
          items:
            $ref: '#/components/schemas/LinkNaoPdf'

    ErroDownload:
      type: object
      additionalProperties: true
      properties:
        titulo:
          type: string
        url:
          type: string
        erro:
          type: string
        mensagem:
          type: string
        status_code:
          type: integer

    ErrosDownloadResponse:
      type: object
      additionalProperties: true
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ErroDownload'
        erros:
          type: array
          items:
            $ref: '#/components/schemas/ErroDownload'
