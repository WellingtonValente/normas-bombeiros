name: Atualizar normas CBMMG

on:
  workflow_dispatch:
  schedule:
    # Toda segunda-feira às 06:30 UTC. Ajuste se preferir mensal.
    - cron: '30 6 * * 1'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sincronizar PDFs e JSONs oficiais do CBMMG
        run: |
          python scripts/sincronizar_normas_cbmmg.py --out docs --extract-text

      - name: Verificar alterações
        id: diff
        run: |
          if git diff --quiet -- docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit automático
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Atualiza base CBMMG $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
